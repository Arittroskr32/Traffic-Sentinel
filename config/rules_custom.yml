# ============================================================
# TrafficSentinel - Custom Detection Rules
# ============================================================
# REQUIRED STRUCTURE:
#   rules:
#     - id: string
#       category: string
#       regex: true|false
#       targets: [ supported target names ]
#       patterns: [ list of regex or plain strings ]
#
# SUPPORTED TARGETS:
#   uri, path, query, query_params,
#   headers, headers_kv,
#   cookies, cookies_params,
#   user_agent, body,
#   combined
#
# NOTE:
# - Score per hit = 1 (enforced by code)
# - Restart TrafficSentinel after editing this file
# ============================================================

rules:

# ============================================================
# XSS
# ============================================================
- id: "XSS_SCRIPT_TAG"
  category: "xss"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)<\\s*script\\b[^>]*>"
    - "(?i)</\\s*script\\s*>"
    # URL-encoded <script
    - "(?i)%3c\\s*script\\b"

- id: "XSS_EVENT_HANDLERS"
  category: "xss"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)\\bon\\w+\\s*=\\s*['\\\"]?[^'\\\">]{0,120}"

- id: "XSS_JS_PROTOCOL"
  category: "xss"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)javascript\\s*:"
    - "(?i)data\\s*:\\s*text\\s*/\\s*html"
    # encoded "javascript:"
    - "(?i)javascript%3a"

- id: "XSS_COMMON_JS_FUNCS"
  category: "xss"
  regex: true
  targets: ["query_params", "body"]
  patterns:
    - "(?i)\\b(?:alert|prompt|confirm)\\s*\\("

- id: "XSS_IMG_SVG_PAYLOADS"
  category: "xss"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)<\\s*img\\b[^>]*\\bon\\w+\\s*="
    - "(?i)<\\s*svg\\b[^>]*\\bon\\w+\\s*="


# ============================================================
# SQL Injection (SQLi)
# ============================================================
- id: "SQLI_TAUTOLOGY"
  category: "sqli"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)(?:'|%27)\\s*or\\s*1\\s*=\\s*1"
    - "(?i)\\bor\\s+\\d+\\s*=\\s*\\d+\\b"

- id: "SQLI_UNION_SELECT"
  category: "sqli"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)\\bunion\\b\\s*(?:all\\s+)?\\bselect\\b"
    # encoded "union select"
    - "(?i)union%20(?:all%20)?select"

- id: "SQLI_COMMENT_TRUNCATION"
  category: "sqli"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    # tighter: require SQL-ish words near comment
    - "(?i)\\b(select|union|where|and|or|sleep|benchmark)\\b[^\\n]{0,80}(?:--|#|/\\*)"

- id: "SQLI_TIME_BASED"
  category: "sqli"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)\\bsleep\\s*\\("
    - "(?i)\\bbenchmark\\s*\\("
    - "(?i)\\bpg_sleep\\s*\\("
    # encoded sleep(
    - "(?i)sleep%28"

- id: "SQLI_SCHEMA_ENUM"
  category: "sqli"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)\\binformation_schema\\b"
    - "(?i)\\bmysql\\.user\\b"


# ============================================================
# LFI / Path Traversal
# ============================================================
- id: "LFI_TRAVERSAL"
  category: "lfi"
  regex: true
  targets: ["uri", "query_params", "combined"]
  patterns:
    - "(?:\\.\\./|%2e%2e%2f|\\.\\.\\\\|%2e%2e%5c){1,8}"

- id: "LFI_SENSITIVE_FILES"
  category: "lfi"
  regex: true
  targets: ["uri", "query_params", "combined"]
  patterns:
    - "(?i)/etc/passwd"
    - "(?i)/etc/shadow"
    - "(?i)/proc/self/environ"
    - "(?i)boot\\.ini"
    - "(?i)windows\\\\win\\.ini"
    # encoded /etc/passwd
    - "(?i)%2fetc%2fpasswd"

- id: "LFI_NULL_BYTE"
  category: "lfi"
  regex: true
  targets: ["query_params", "combined"]
  patterns:
    - "%00"
    - "\\x00"


# ============================================================
# RCE / Command Injection
# ============================================================
- id: "RCE_COMMAND_CHAINING"
  category: "rce"
  regex: true
  targets: ["args", "body", "combined"]
  patterns:
    - "(?i)(?:;|&&|\\|\\||\\|)\\s*(?:id|whoami|uname|cat|curl|wget|bash|sh|python|perl|nc|netcat)\\b"
    - "(?i)(?:%3b|%26%26|%7c%7c|%7c)\\s*(?:id|whoami|uname|cat|curl|wget|bash|sh|python|perl|nc|netcat)\\b"

- id: "RCE_STANDALONE_SHELL_CMD_BODY"
  category: "rce"
  regex: true
  targets: ["body", "combined", "args"]
  patterns:
    # Standalone command on its own line inside multipart or plain bodies
    - "(?im)(?:\\r?\\n\\r?\\n|^)(?:id|whoami|uname|pwd|ls)\\s*(?:\\r?\\n|$)"

    # Command with a simple argument (kept short to reduce false positives)
    - "(?im)(?:\\r?\\n\\r?\\n|^)(?:cat)\\s+[^\\r\\n]{1,80}(?:\\r?\\n|$)"


- id: "RCE_SUBSHELL_EXEC"
  category: "rce"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "\\$\\([^\\)]{1,120}\\)"
    - "`[^`]{1,120}`"
    # encoded $(
    - "%24%28[^\\)]{1,120}\\)"

- id: "RCE_ENV_EXPANSION"
  category: "rce"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "\\$\\{(?:IFS|PATH|HOME|SHELL|PWD)\\}"

- id: "PHP_EXEC_FUNCS"
  category: "php"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)\\b(?:system|exec|shell_exec|passthru|popen|proc_open)\\s*\\("


# ============================================================
# SSRF
# ============================================================
- id: "SSRF_INTERNAL_HOSTS"
  category: "ssrf"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    # =========================================================
    # Decoded URLs (http / https)
    - "(?i)https?://(?:localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\])"
    - "(?i)https?://169\\.254\\.169\\.254"

    # =========================================================
    # URL-encoded (http%3A// or https%3A//)
    - "(?i)https?%3a%2f%2f(?:localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)"
    - "(?i)https?%3a%2f%2f\\[::1\\]"
    - "(?i)https?%3a%2f%2f169\\.254\\.169\\.254"

    # =========================================================
    # Double URL-encoded (http%253A%252F%252F...)
    - "(?i)https?%253a%252f%252f(?:localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)"
    - "(?i)https?%253a%252f%252f169\\.254\\.169\\.254"



# ============================================================
# SSTI
# ============================================================
- id: "SSTI_JINJA"
  category: "ssti"
  regex: true
  targets: ["args", "body", "combined"]
  patterns:
    # raw {{ ... }} and {% ... %}
    - "\\{\\{[^\\}]{1,400}\\}\\}"
    - "\\{\\%[^\\%]{1,400}\\%\\}"
    - "(?i)%7b%7b.{1,800}?%7d%7d"

- id: "SSTI_PYTHON_INTROSPECTION"
  category: "ssti"
  regex: true
  targets: ["args", "body", "combined"]
  patterns:
    - "__class__"
    - "__mro__"
    - "__subclasses__"
    - "__globals__"
    - "__builtins__"
    - "__import__"


# ============================================================
# PHP Wrappers / Streams
# ============================================================
- id: "PHP_STREAM_WRAPPERS"
  category: "php"
  regex: true
  targets: ["query_params", "body", "combined"]
  patterns:
    - "(?i)php://(?:input|filter|stdin)"
    - "(?i)expect://"
    - "(?i)data://text/plain"
    - "(?i)phar://"
    - "(?i)zip://"
    # encoded php://
    - "(?i)php%3a%2f%2f"


# ============================================================
# XXE
# ============================================================
- id: "XXE_ENTITY_DECLARATION"
  category: "xxe"
  regex: true
  targets: ["body", "combined"]
  patterns:
    - "(?i)<!DOCTYPE\\s+[^>]{1,240}>"
    - "(?i)<!ENTITY\\s+[^>]{1,240}>"
    # encoded <!DOCTYPE
    - "(?i)%3c!doctype"


# ============================================================
# Recon / Scanner Detection
# ============================================================
- id: "SCAN_WORDPRESS"
  category: "scan"
  regex: true
  targets: ["path", "uri"]
  patterns:
    - "(?i)^/wp-admin"
    - "(?i)^/wp-login\\.php"
    - "(?i)^/xmlrpc\\.php"
    - "(?i)^/wp-content"

- id: "SCAN_DOTFILES"
  category: "scan"
  regex: true
  targets: ["path", "uri"]
  patterns:
    - "(?i)^/\\.env"
    - "(?i)^/\\.git/"
    - "(?i)^/\\.svn/"
    - "(?i)^/\\.hg/"

- id: "SCAN_CONFIG_BACKUPS"
  category: "scan"
  regex: true
  targets: ["path", "uri"]
  patterns:
    - "\\.(?:bak|old|backup|swp|tmp)$"

- id: "SCAN_DEBUG_ENDPOINTS"
  category: "scan"
  regex: true
  targets: ["path", "uri"]
  patterns:
    - "(?i)^/debug"
    - "(?i)^/swagger"
    - "(?i)^/swagger-ui"
    - "(?i)^/api-docs"
    - "(?i)^/actuator"


