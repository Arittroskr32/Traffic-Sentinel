# ===============================
# TrafficSentinel Configuration
# ===============================

# -------------------------------
# Capture settings (PCAP mode) - UNUSED when running log ingestion only
# -------------------------------
capture:
  interface: "eth0"
  pcap_dir: "./pcap"
  slice_seconds: 60
  tcpdump_path: "tcpdump"
  tshark_path: "tshark"
  bpf_filter: "tcp or udp"
  snaplen: 0

# -------------------------------
# Logging paths
# -------------------------------
logging:
  events_log: "./state/events.log"
  actions_log: "./state/actions.log"
  error_log: "./state/error.log"

  # Optional (logs everything including score=0)
  # all_requests_log: "./state/all_requests.jsonl"

# -------------------------------
# -------------------------------
# Enforcement behavior
# -------------------------------
enforcement:
  # ✅ 'mark' = review-only (NO firewall bans, only flags in state/actions.log)
  # ✅ 'ban'  = legacy auto-ban behavior
  # ✅ 'off'  = log-only (no ban, no flags)
  action: "mark"

  # Firewall backend settings (used only when action: "ban")
  mode: "iptables"
  chain: "INPUT"
  ts_chain: "TS_BLOCK"

# Ingestion mode (LOG is recommended for HTTPS)
# -------------------------------
ingestion:
  mode: "log"          # "pcap" or "log"
  log_source: "jsonl"  # "access" or "jsonl"
  log_path: "/hostlogs/trafficsentinel.jsonl"

  offset_file: "./state/log_offset.json"
  batch_lines: 2000

  bruteforce:
    enabled: true
    threshold_per_minute: 10
    fail_statuses: [401, 403]
    endpoints:
      - "/login"
      - "/signin"
      - "/auth"

# -------------------------------
# Detector / rules
# -------------------------------
rules:
  compiled_rules_path: "./config/rules_compiled.yml"
  custom_rules_path: "./config/rules_custom.yml"

# -------------------------------
# Reputation / penalty system
# -------------------------------
reputation:
  ban_threshold: 7
  ban_seconds: 3600
  ban_limit: 3
  decay_seconds: 3600

# -------------------------------
# Allowlist (never banned)
# -------------------------------
allowlist:
  enabled: true

  # ✅ These IPs/CIDRs will NEVER be banned no matter what payloads they send
  static:
    - "127.0.0.1"
    - "::1"

    # ✅ Add your own public IP(s) here
    - "YOUR_PUBLIC_IP/32"
    # - "ANOTHER_PUBLIC_IP/32"
    # - "203.0.113.0/24"   # example CIDR range

  # Optional: trusted teammate ranges
  trusted_testers: []

  # Optional alias key (same behavior as static)
  never_ban: []

# -------------------------------
# Scoring mode (per_request recommended)
# -------------------------------
scoring:
  mode: "per_request"

# -------------------------------
# PCAP metadata detections (optional)
# -------------------------------
pcap_metadata:
  enabled: false   # PCAP mode disabled (log ingestion only)
  portscan:
    threshold_unique_ports: 20
    score: 1
  synflood:
    threshold_syn_packets: 200
    score: 1

# -------------------------------
# Telegram alerts (optional)
# -------------------------------
telegram:
  enabled: false
  bot_token: "8085778744:AAGkGFpzupA86a4x98aNsPEmxjIjOUWtpUo"
  chat_id: "1363442206"
  cooldown_seconds: 60
  include_evidence: true
