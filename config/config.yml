# ===============================
# TrafficSentinel Configuration
# ===============================

# -------------------------------
# Capture settings (PCAP mode) - UNUSED when running log ingestion only
# -------------------------------
capture:
  interface: "eth0"
  pcap_dir: "./pcap"
  slice_seconds: 60
  tcpdump_path: "tcpdump"
  tshark_path: "tshark"
  bpf_filter: "tcp or udp"
  snaplen: 0

# -------------------------------
# Logging paths
# -------------------------------
logging:
  events_log: "./state/events.log"
  actions_log: "./state/actions.log"
  error_log: "./state/error.log"

  # Optional (logs everything including score=0)
  # all_requests_log: "./state/all_requests.log"

# -------------------------------
# Ingestion mode (LOG is recommended for HTTPS)
# -------------------------------
ingestion:
  mode: "log"          # "pcap" or "log"
  log_source: "jsonl"  # "access" or "jsonl"
  log_path: "/hostlogs/trafficsentinel.jsonl"

  offset_file: "./state/log_offset.json"
  batch_lines: 2000

  bruteforce:
    enabled: true
    threshold_per_minute: 10
    fail_statuses: [401, 403]
    endpoints:
      - "/login"
      - "/signin"
      - "/auth"

# -------------------------------
# Detector / rules
# -------------------------------
rules:
  compiled_rules_path: "./config/rules_compiled.yml"
  custom_rules_path: "./config/rules_custom.yml"

# -------------------------------
# Reputation / penalty system
# -------------------------------
reputation:
  ban_threshold: 7
  ban_seconds: 3600
  ban_limit: 3
  decay_seconds: 3600

# -------------------------------
# Allowlist (never banned)
# -------------------------------
allowlist:
  enabled: true
  ips:
    - "127.0.0.1"
    - "::1"

# -------------------------------
# Scoring mode (per_request recommended)
# -------------------------------
scoring:
  mode: "per_request"

# -------------------------------
# PCAP metadata detections (optional)
# -------------------------------
pcap_metadata:
  enabled: false   # PCAP mode disabled (log ingestion only)
  portscan:
    threshold_unique_ports: 20
    score: 1
  synflood:
    threshold_syn_packets: 200
    score: 1
