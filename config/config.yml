# ===============================
# TrafficSentinel Configuration
# ===============================

# -------------------------------
# Capture settings (PCAP mode)
# -------------------------------
capture:
  interface: "eth0"
  pcap_dir: "./pcap"
  slice_seconds: 60
  tcpdump_path: "tcpdump"
  tshark_path: "tshark"
  bpf_filter: "tcp or udp"
  snaplen: 0

# -------------------------------
# Ingestion mode (HTTPS support)
# -------------------------------
ingestion:
  mode: "log"          # "pcap" or "log"
  log_source: "jsonl"  # "access" or "jsonl"
  log_path: "/hostlogs/trafficsentinel.jsonl"

  offset_file: "./state/log_offset.json"
  batch_lines: 2000

  bruteforce:
    enabled: true
    threshold_per_minute: 10
    fail_statuses: [401, 403]
    endpoints:
      - "/login"
      - "/signin"
      - "/auth"
      - "/api/auth"
      - "/wp-login.php"
      - "/admin"
      - "/administrator"

# -------------------------------
# Detection rules
# -------------------------------
rules:
  compiled_rules_path: "./config/rules_compiled.yml"
  custom_rules_path: "./config/rules_custom.yml"

# -------------------------------
# Reputation / penalty system
# -------------------------------
reputation:
  ban_threshold: 7
  ban_seconds: 3600
  ban_limit: 3
  decay_seconds: 3600

# -------------------------------
# Allowlist (never banned)
# -------------------------------
allowlist:
  static:
    - "127.0.0.1"
  trusted_testers:
    - "192.168.1.0/24"

# -------------------------------
# Firewall enforcement
# -------------------------------
enforcement:
  mode: "iptables"
  chain: "INPUT"
  ts_chain: "TS_BLOCK"

# -------------------------------
# Logging
# -------------------------------
logging:
  events_log: "./state/events.log"            # ✅ only score>0 events
  actions_log: "./state/actions.log"
  error_log: "./state/error.log"
  reputation_file: "./state/reputation.json"
  all_requests_log: "./state/all_requests.log"  # ✅ optional: logs everything

# -------------------------------
# Scoring behavior
# -------------------------------
scoring:
  mode: "per_request"

# -------------------------------
# PCAP metadata detections (optional)
# -------------------------------
pcap_metadata:
  enabled: true
  portscan:
    threshold_unique_ports: 20
    score: 1
  synflood:
    threshold_syn_packets: 200
    score: 1
