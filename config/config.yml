# ===============================
# TrafficSentinel Configuration
# ===============================

# -------------------------------
# Capture settings (PCAP mode)
# -------------------------------
capture:
  interface: "eth0"
  pcap_dir: "./pcap"
  slice_seconds: 60
  tcpdump_path: "tcpdump"
  tshark_path: "tshark"
  bpf_filter: "tcp or udp"
  snaplen: 0

# -------------------------------
# Ingestion mode (HTTPS support)
# -------------------------------
ingestion:
  # Use "log" mode for HTTPS-friendly ingestion
  mode: "log"

  # For Option A: JSONL produced by your app/proxy logger
  log_source: "jsonl"

  # This file must exist on the HOST at:
  #   /var/log/nginx/trafficsentinel.jsonl
  # ...and is mounted into container via:
  #   - /var/log/nginx:/hostlogs:ro
  log_path: "/hostlogs/trafficsentinel.jsonl"

  # Stateful tail offset (prevents reprocessing)
  offset_file: "./state/log_offset.json"

  # Max lines read per loop
  batch_lines: 2000

  # Bruteforce detection from logs (works well when status codes exist)
  bruteforce:
    enabled: true
    threshold_per_minute: 10
    fail_statuses: [401, 403]
    endpoints:
      - "/login"
      - "/signin"
      - "/auth"
      - "/api/auth"
      - "/wp-login.php"
      - "/admin"
      - "/administrator"

# -------------------------------
# Detection rules
# -------------------------------
rules:
  compiled_rules_path: "./config/rules_compiled.yml"
  custom_rules_path: "./config/rules_custom.yml"

# -------------------------------
# Reputation / penalty system
# -------------------------------
reputation:
  ban_threshold: 7
  ban_seconds: 3600
  ban_limit: 3
  decay_seconds: 3600

# -------------------------------
# Allowlist (never banned)
# -------------------------------
# IMPORTANT: only ONE allowlist key (no duplicates)
allowlist:
  static:
    - "127.0.0.1"
  trusted_testers:
    - "192.168.1.0/24"

# -------------------------------
# Firewall enforcement
# -------------------------------
enforcement:
  mode: "iptables"
  chain: "INPUT"
  ts_chain: "TS_BLOCK"

# -------------------------------
# Logging
# -------------------------------
logging:
  events_log: "./state/events.log"
  actions_log: "./state/actions.log"
  error_log: "./state/error.log"
  reputation_file: "./state/reputation.json"

# -------------------------------
# Scoring behavior
# -------------------------------
scoring:
  # per_request = max +1 per request (you are using this)
  mode: "per_request"

# -------------------------------
# PCAP metadata detections (HTTPS-friendly)
# (still usable if you switch ingestion.mode back to pcap)
# -------------------------------
pcap_metadata:
  enabled: true

  portscan:
    threshold_unique_ports: 20
    score: 1

  synflood:
    threshold_syn_packets: 200
    score: 1
