<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="TrafficSentinel architecture diagram">
  <defs>
    <style type="text/css"><![CDATA[
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #333; }
      .box { fill: #ffffff; stroke: #111; stroke-width: 2; rx: 14; ry: 14; }
      .small { font-size: 13px; fill: #222; }
      .label { font-size: 15px; font-weight: 700; }
      .muted { font-size: 12px; fill: #444; }
      .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
      .dashed { stroke-dasharray: 7 7; }
    ]]></style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="55" class="title">TrafficSentinel Architecture</text>
  <text x="40" y="80" class="subtitle">Network traffic capture and log ingestion, rule-based detection, scoring, and automatic IP banning via iptables</text>

  <!-- Left: Inputs -->
  <rect x="40" y="130" width="330" height="240" class="box"/>
  <text x="65" y="165" class="label">Inputs</text>

  <rect x="70" y="190" width="270" height="70" class="box"/>
  <text x="90" y="220" class="small">PCAP capture</text>
  <text x="90" y="242" class="muted">tcpdump/tshark, plaintext HTTP metadata</text>

  <rect x="70" y="275" width="270" height="70" class="box"/>
  <text x="90" y="305" class="small">Log ingestion (recommended)</text>
  <text x="90" y="327" class="muted">JSONL or access logs, supports HTTPS context</text>

  <!-- Middle: Parsing -->
  <rect x="430" y="130" width="330" height="240" class="box"/>
  <text x="455" y="165" class="label">Ingest and Parse</text>
  <text x="455" y="195" class="small">ingestor/parsers.py</text>

  <rect x="460" y="215" width="270" height="55" class="box"/>
  <text x="480" y="247" class="muted">Normalize event fields</text>

  <rect x="460" y="285" width="270" height="70" class="box"/>
  <text x="480" y="315" class="muted">Extract: IP, method, path, query,</text>
  <text x="480" y="337" class="muted">headers, body (when available), status</text>

  <!-- Arrows from inputs to parsing -->
  <path d="M340 225 L430 225" class="arrow"/>
  <path d="M340 310 L430 310" class="arrow"/>

  <!-- Right: Detection -->
  <rect x="820" y="130" width="340" height="240" class="box"/>
  <text x="845" y="165" class="label">Detect and Score</text>
  <text x="845" y="195" class="small">analyzer/detector.py + rules/*.yml</text>

  <rect x="850" y="215" width="280" height="60" class="box"/>
  <text x="870" y="245" class="muted">Rule matching (SQLi, XSS, RCE,</text>
  <text x="870" y="267" class="muted">SSTI, LFI, traversal, PHP, etc.)</text>

  <rect x="850" y="290" width="280" height="65" class="box"/>
  <text x="870" y="320" class="muted">Score aggregation and thresholds</text>
  <text x="870" y="342" class="muted">Category weighting, burst detection</text>

  <!-- Arrow from parse to detect -->
  <path d="M760 270 L820 270" class="arrow"/>

  <!-- Bottom: State + Enforcement -->
  <rect x="40" y="420" width="1120" height="250" class="box"/>
  <text x="65" y="455" class="label">State and Enforcement</text>

  <rect x="70" y="485" width="330" height="150" class="box"/>
  <text x="90" y="515" class="small">Reputation state</text>
  <text x="90" y="538" class="muted">core/state.py</text>
  <text x="90" y="563" class="muted">state/reputation.json (score, decay, bans)</text>
  <text x="90" y="588" class="muted">events.log (audit trail)</text>

  <rect x="435" y="485" width="330" height="150" class="box"/>
  <text x="455" y="515" class="small">Ban decision</text>
  <text x="455" y="538" class="muted">Ban when score exceeds threshold</text>
  <text x="455" y="563" class="muted">Duration and cooldown from config</text>
  <text x="455" y="588" class="muted">Optional brute-force heuristics</text>

  <rect x="800" y="485" width="330" height="150" class="box"/>
  <text x="820" y="515" class="small">Firewall enforcement</text>
  <text x="820" y="538" class="muted">enforcer/firewall.py</text>
  <text x="820" y="563" class="muted">iptables chain: TS_BLOCK</text>
  <text x="820" y="588" class="muted">Auto-add and remove expired bans</text>

  <!-- Arrows down to bottom section -->
  <path d="M995 370 L995 420" class="arrow"/>
  <path d="M595 370 L595 420" class="arrow"/>
  <path d="M205 370 L205 420" class="arrow"/>

  <!-- Cross arrows inside bottom -->
  <path d="M400 560 L435 560" class="arrow"/>
  <path d="M765 560 L800 560" class="arrow"/>

  <!-- Footnote -->
  <text x="40" y="705" class="muted">Runtime requirements: host networking and NET_ADMIN/NET_RAW (iptables and packet capture). HTTPS payload visibility requires log ingestion with rich fields (JSONL).</text>
</svg>
