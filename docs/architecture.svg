<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style><![CDATA[
      .bg { fill: #0b1220; }
      .title { font: 700 34px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e5e7eb; }
      .sub { font: 500 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #cbd5e1; }
      .lbl { font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e5e7eb; }
      .txt { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #cbd5e1; }
      .node { fill: #0f1b33; stroke: #7dd3fc; stroke-width: 2; rx: 18; }
      .node2 { fill: #0f1b33; stroke: #a78bfa; stroke-width: 2; rx: 18; }
      .node3 { fill: #0f1b33; stroke: #34d399; stroke-width: 2; rx: 18; }
      .node4 { fill: #0f1b33; stroke: #fbbf24; stroke-width: 2; rx: 18; }
      .muted { fill: #0f1b33; stroke: #64748b; stroke-width: 2; rx: 18; opacity: 0.95; }
      .arrow { stroke: #93c5fd; stroke-width: 3; fill: none; }
      .arrow2 { stroke: #a78bfa; stroke-width: 3; fill: none; stroke-dasharray: 10 7; opacity: 0.95;}
      .arrow3 { stroke: #34d399; stroke-width: 3; fill: none; }
      .arrow4 { stroke: #fbbf24; stroke-width: 3; fill: none; }
      .small { font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #94a3b8; }
      .pill { fill: #0b162e; stroke: #334155; stroke-width: 1.5; rx: 14; }
    ]]></style>

    <marker id="mArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#93c5fd"/>
    </marker>
    <marker id="mArrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#a78bfa"/>
    </marker>
    <marker id="mArrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#34d399"/>
    </marker>
    <marker id="mArrow4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#fbbf24"/>
    </marker>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title" x="70" y="70">TrafficSentinel — Architecture</text>
  <text class="sub" x="70" y="102">Log-based detection → explainable scoring → optional alerting + enforcement</text>

  <!-- Sources column -->
  <rect class="node" x="70" y="150" width="340" height="120" filter="url(#softShadow)"/>
  <text class="lbl" x="95" y="190">Nginx / Reverse Proxy</text>
  <text class="txt" x="95" y="215">JSONL access logs (HTTPS-ready)</text>
  <text class="small" x="95" y="240">Fields: remote_addr, xff, request, uri, status, ua, body…</text>

  <rect class="muted" x="70" y="295" width="340" height="120" filter="url(#softShadow)"/>
  <text class="lbl" x="95" y="335">PCAP Capture (experimental)</text>
  <text class="txt" x="95" y="360">agent/ capture pipeline</text>
  <text class="small" x="95" y="385">Present in repo, not wired into runtime</text>

  <!-- TrafficSentinel runtime (center) -->
  <rect class="node2" x="470" y="150" width="670" height="420" filter="url(#softShadow)"/>
  <text class="lbl" x="500" y="190">TrafficSentinel Runtime (main.py)</text>
  <text class="small" x="500" y="214">Single-host, low-resource loop • deterministic rules • near-real-time processing</text>

  <!-- stages inside runtime -->
  <rect class="node" x="510" y="245" width="260" height="90"/>
  <text class="lbl" x="535" y="280">Log Tailer</text>
  <text class="txt" x="535" y="305">ingestor/log_reader.py</text>

  <rect class="node" x="810" y="245" width="290" height="90"/>
  <text class="lbl" x="835" y="280">Parser + Normalizer</text>
  <text class="txt" x="835" y="305">ingestor/parsers.py • ingestor/normalizer.py</text>

  <rect class="node" x="510" y="360" width="300" height="110"/>
  <text class="lbl" x="535" y="395">Detection Engine</text>
  <text class="txt" x="535" y="420">Regex rules (best-hit per request)</text>
  <text class="small" x="535" y="444">analyzer/detector.py • analyzer/rules*.yml</text>

  <rect class="node" x="830" y="360" width="270" height="110"/>
  <text class="lbl" x="855" y="395">Bruteforce Analyzer</text>
  <text class="txt" x="855" y="420">Endpoint + status rate checks</text>
  <text class="small" x="855" y="444">ingestor/bruteforce.py</text>

  <rect class="node3" x="510" y="495" width="370" height="60"/>
  <text class="lbl" x="535" y="532">Reputation + Scoring</text>
  <text class="small" x="710" y="532">(per-IP penalty, decay, bans, allowlist)</text>

  <rect class="node4" x="900" y="495" width="200" height="60"/>
  <text class="lbl" x="925" y="520">Enforcement</text>
  <text class="small" x="925" y="542">off • mark • ban</text>

  <!-- Config / Rules -->
  <rect class="pill" x="1180" y="160" width="350" height="165" filter="url(#softShadow)"/>
  <text class="lbl" x="1210" y="195">Config + Rules</text>
  <text class="txt" x="1210" y="220">config/config.yml</text>
  <text class="txt" x="1210" y="245">rules/rules_custom.yml (authoritative)</text>
  <text class="small" x="1210" y="270">rules_loader loads configured rule files</text>
  <text class="small" x="1210" y="295">real client IP: log processed $remote_addr</text>

  <!-- State / Outputs -->
  <rect class="pill" x="470" y="610" width="670" height="230" filter="url(#softShadow)"/>
  <text class="lbl" x="500" y="645">State + Outputs</text>

  <rect class="node" x="510" y="680" width="270" height="110"/>
  <text class="lbl" x="535" y="715">Event Writer</text>
  <text class="txt" x="535" y="740">state/events.log</text>
  <text class="small" x="535" y="765">append-only security events</text>

  <rect class="node" x="810" y="680" width="320" height="110"/>
  <text class="lbl" x="835" y="715">Reputation Store</text>
  <text class="txt" x="835" y="740">state/reputation.json</text>
  <text class="small" x="835" y="765">recent_events, ban_until, ban_count…</text>

  <rect class="node3" x="1180" y="350" width="350" height="140" filter="url(#softShadow)"/>
  <text class="lbl" x="1210" y="388">Alerting</text>
  <text class="txt" x="1210" y="415">Telegram (optional)</text>
  <text class="small" x="1210" y="440">cooldown + thresholded notifications</text>
  <text class="small" x="1210" y="465">core/telegram_alert.py</text>

  <rect class="node4" x="1180" y="520" width="350" height="140" filter="url(#softShadow)"/>
  <text class="lbl" x="1210" y="558">Firewall Integration</text>
  <text class="txt" x="1210" y="585">iptables chain TS_BLOCK</text>
  <text class="small" x="1210" y="610">enforcer/firewall.py: ban/unban, expiry sync</text>
  <text class="small" x="1210" y="635">actions logged: state/actions.log</text>

  <!-- CLI / Ops -->
  <rect class="node" x="70" y="460" width="340" height="170" filter="url(#softShadow)"/>
  <text class="lbl" x="95" y="495">Admin CLI (cli.py)</text>
  <text class="txt" x="95" y="522">show-top • status &lt;IP&gt;</text>
  <text class="txt" x="95" y="548">clear-penalty • unban</text>
  <text class="txt" x="95" y="574">allowlist add/remove/list</text>

  <rect class="pill" x="70" y="655" width="340" height="185" filter="url(#softShadow)"/>
  <text class="lbl" x="95" y="690">Deployment</text>
  <text class="txt" x="95" y="718">Docker Compose (recommended)</text>
  <text class="txt" x="95" y="744">Systemd unit (optional)</text>
  <text class="small" x="95" y="770">Runs: python3 cli.py run --interval 2</text>
  <text class="small" x="95" y="795">Mount /var/log/nginx as read-only</text>

  <!-- Downstream integrations -->
  <rect class="pill" x="1180" y="690" width="350" height="150" filter="url(#softShadow)"/>
  <text class="lbl" x="1210" y="725">Downstream Automation</text>
  <text class="txt" x="1210" y="752">Fail2Ban / SIEM / scripts</text>
  <text class="small" x="1210" y="777">Consume events.log/actions.log or query state</text>
  <text class="small" x="1210" y="802">TrafficSentinel stays explainable + decoupled</text>

  <!-- arrows -->
  <path class="arrow" d="M 410 210 C 430 210, 445 220, 470 245" marker-end="url(#mArrow)"/>
  <path class="arrow2" d="M 410 355 C 440 355, 440 350, 470 330" marker-end="url(#mArrow2)"/>

  <path class="arrow" d="M 770 290 L 810 290" marker-end="url(#mArrow)"/>
  <path class="arrow" d="M 955 335 C 955 345, 955 350, 955 360" marker-end="url(#mArrow)"/>

  <path class="arrow" d="M 660 450 C 660 468, 660 476, 660 495" marker-end="url(#mArrow)"/>
  <path class="arrow" d="M 965 470 C 990 470, 1000 480, 1000 495" marker-end="url(#mArrow)"/>

  <path class="arrow3" d="M 880 525 L 900 525" marker-end="url(#mArrow3)"/>

  <path class="arrow" d="M 680 555 C 680 600, 680 635, 645 680" marker-end="url(#mArrow)"/>
  <path class="arrow" d="M 750 555 C 780 610, 835 640, 900 680" marker-end="url(#mArrow)"/>

  <path class="arrow" d="M 1140 250 C 1120 250, 1105 250, 1100 260" marker-end="url(#mArrow)"/>

  <path class="arrow3" d="M 1100 525 C 1140 525, 1160 520, 1180 560" marker-end="url(#mArrow3)"/>

  <path class="arrow4" d="M 1100 525 C 1140 525, 1160 545, 1180 585" marker-end="url(#mArrow4)"/>

  <path class="arrow" d="M 410 545 C 450 545, 455 560, 470 585" marker-end="url(#mArrow)"/>

  <path class="arrow" d="M 780 735 C 980 735, 1100 735, 1180 760" marker-end="url(#mArrow)"/>
  <path class="arrow" d="M 1130 740 C 1200 690, 1300 660, 1400 660" marker-end="url(#mArrow)"/>

  <!-- footer note -->
  <text class="small" x="70" y="875">Repo layout: agent/, analyzer/, ingestor/, core/, enforcer/, rules/, config/, state/</text>
</svg>
