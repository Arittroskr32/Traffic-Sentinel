<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>

  <!-- Row 1 -->
  <rect x="20" y="20" width="220" height="80" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="130" y="55" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Incoming Traffic</text>
  <text x="130" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">HTTP / HTTPS</text>

  <rect x="270" y="20" width="220" height="80" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="380" y="55" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Ingest</text>
  <text x="380" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">PCAP slices or Logs tail</text>

  <rect x="520" y="20" width="220" height="80" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="630" y="55" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Detect</text>
  <text x="630" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">CRS + Custom Rules</text>

  <rect x="770" y="20" width="190" height="80" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="865" y="55" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111827">Reputation</text>
  <text x="865" y="78" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">penalty / decay / ban</text>

  <line x1="240" y1="60" x2="270" y2="60" stroke="#374151" stroke-width="2"/>
  <line x1="490" y1="60" x2="520" y2="60" stroke="#374151" stroke-width="2"/>
  <line x1="740" y1="60" x2="770" y2="60" stroke="#374151" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="270" y="140" width="220" height="90" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="380" y="170" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">PCAP Mode</text>
  <text x="380" y="193" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">tcpdump + tshark</text>
  <text x="380" y="213" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">HTTP + metadata</text>

  <rect x="270" y="250" width="220" height="90" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="380" y="280" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Log Mode</text>
  <text x="380" y="303" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">nginx / apache / jsonl</text>
  <text x="380" y="323" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">HTTPS-capable</text>

  <rect x="520" y="195" width="220" height="90" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="630" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Bruteforce</text>
  <text x="630" y="248" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">per-IP per-minute</text>
  <text x="630" y="268" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">401/403 aware (logs)</text>

  <line x1="380" y1="100" x2="380" y2="140" stroke="#374151" stroke-width="2"/>
  <line x1="380" y1="230" x2="380" y2="250" stroke="#374151" stroke-width="2"/>
  <line x1="490" y1="185" x2="520" y2="230" stroke="#374151" stroke-width="2"/>

  <!-- Row 3 -->
  <rect x="20" y="400" width="240" height="90" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="140" y="432" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Firewall Enforcer</text>
  <text x="140" y="455" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">iptables (TS_BLOCK)</text>

  <rect x="290" y="400" width="240" height="90" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="410" y="432" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">State &amp; Logs</text>
  <text x="410" y="455" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">reputation.json + logs</text>

  <rect x="560" y="400" width="200" height="90" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="660" y="432" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#111827">Admin CLI</text>
  <text x="660" y="455" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">unban / clear / inspect</text>

  <line x1="865" y1="100" x2="140" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="865" y1="100" x2="410" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="660" y1="400" x2="410" y2="400" stroke="#374151" stroke-width="2"/>
</svg>
