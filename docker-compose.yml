version: "3.9"

services:
  trafficsentinel:
    container_name: trafficsentinel
    image: trafficsentinel:latest
    build:
      context: .
      dockerfile: Dockerfile

    # REQUIRED for iptables + host log access
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

    restart: unless-stopped

    command: ["python3", "cli.py", "run", "--interval", "2"]

    volumes:
      # Persist state (reputation, offsets, logs)
      - ./state:/app/state

      # Mount nginx JSONL log from host
      # MUST match ingestion.log_path in config.yml
      - /var/log/nginx:/hostlogs:ro

      # Optional: custom rules
      - ./config:/app/config

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"